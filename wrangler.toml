name = "ai-tabletop"
main = "src/index.js"
compatibility_date = "2026-06-01"
# Keep the variables set in the dashboard (GITHUB_REPO, DEFAULT_BRANCH) on every deploy;
# without this, each Git-triggered deploy deletes them. Secrets are always kept.
keep_vars = true
# Serve the worker at https://<worker-name>.<subdomain>.workers.dev, with no extra preview URLs.
workers_dev = true
preview_urls = false

# No local wrangler needed. After "Connect to Git" in the Cloudflare dashboard, CF reads this file to deploy.
# Environment variables (AUTH_TOKEN / GITHUB_TOKEN / GITHUB_REPO / DEFAULT_BRANCH)
# are set in the CF dashboard under Settings -> Variables and Secrets, never committed to the repo.

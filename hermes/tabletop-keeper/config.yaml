# Hermes profile for the GM. scripts/hermes_profiles.sh installs it; edit models to taste.
model:
  default: claude-sonnet-5-5
  provider: anthropic
providers:
  lmstudio:                     # optional: local models
    name: LM Studio
    base_url: http://127.0.0.1:1234/v1
    discover_models: true
    context_length: 65536
memory:
  memory_enabled: true          # the organizer's feedback, for any later table
  user_profile_enabled: false
agent:
  max_turns: 60
  reasoning_effort: medium      # a seat's "reasoning" overrides it
approvals:
  mode: false                   # unattended turns: no approval prompts
